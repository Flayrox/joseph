name: joseph
options:
  bundleIdPrefix: dev.joseph
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_APP_SANDBOX: false
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic

targets:
  joseph:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Core
      - path: Resources/logo_fill.jpg
        buildPhase: resources
      - path: Resources/logo_outline.png
        buildPhase: resources
      - path: Resources/joseph.icns
        buildPhase: resources
      - path: Resources/Assets.xcassets
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 JOSEPH contributors"
        CFBundleDisplayName: joseph
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.joseph.menubar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

  JOSEPHTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: joseph
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.joseph.menubar.tests
        GENERATE_INFOPLIST_FILE: true

  josephUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: joseph
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.joseph.menubar.uitests
        GENERATE_INFOPLIST_FILE: true
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  joseph:
    build:
      targets:
        joseph: all
        JOSEPHTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JOSEPHTests

  joseph-ui:
    build:
      targets:
        joseph: all
        josephUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - josephUITests