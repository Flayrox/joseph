name: joseph
options:
  bundleIdPrefix: dev.joseph
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_APP_SANDBOX: false
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic

targets:
  joseph:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.joseph.menubar
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 JOSEPH contributors"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_CFBundleDisplayName: joseph
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

  JOSEPHTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: joseph
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.joseph.menubar.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  joseph:
    build:
      targets:
        joseph: all
        JOSEPHTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JOSEPHTests
